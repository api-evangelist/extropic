aid: extropic
name: Extropic
description: >-
  Extropic is a hardware company building thermodynamic (probabilistic) computing
  systems designed to run generative AI workloads at dramatically lower energy cost
  than GPUs. Its core hardware is the Thermodynamic Sampling Unit (TSU) — an
  inherently probabilistic chip whose physics natively performs the sampling that
  probabilistic AI algorithms depend on — together with the XTR-0 prototype platform
  for low-latency communication between Extropic chips and traditional processors.
  Extropic also develops THRML, an open-source JAX library for building and sampling
  probabilistic graphical models (block Gibbs sampling and energy-based models),
  which serves as a simulator and prototyping surface for the block-sampling programs
  that will one day run on TSU hardware. Extropic is not an API provider: it ships no
  REST/GraphQL API, developer portal, or hosted service — its public developer
  surface is the THRML Python library, its documentation, and an agent skill. Backed
  by Kindred Ventures; surfaced to the API Evangelist network as an AI-hardware
  portfolio company.
